name: Bug report
description: Report a reproducible problem in Folder Terminal
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Remove private paths, shell history, tokens, and personal files from anything you share.

  - type: input
    id: version
    attributes:
      label: Folder Terminal version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behaviour and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Add...
        3. Choose...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitised screenshots or logs if they help. For terminal issues, include the shell and whether a foreground process was running.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private or sensitive information from this report.
          required: true
