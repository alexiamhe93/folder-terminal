name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app

      - name: Verify app bundle
        run: |
          plutil -lint dist/FolderTerminal.app/Contents/Info.plist
          codesign --verify --deep --strict dist/FolderTerminal.app
